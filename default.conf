# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=envconfig:10m rate=5r/s;

server {
  listen 8080;
  # Wildcard: este nginx solo recibe tráfico interno del proxy, nunca directo
  # de internet — no necesita conocer el dominio real.
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  client_body_timeout   10s;
  client_header_timeout 10s;
  send_timeout          30s;
  keepalive_timeout     65s;

  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # --- Security headers globales ---
  add_header X-Frame-Options            "DENY"                          always;
  add_header X-Content-Type-Options     "nosniff"                       always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-XSS-Protection           "1; mode=block"                 always;

  # HSTS: el proxy upstream termina TLS y propaga X-Forwarded-Proto
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # style-src 'unsafe-inline' requerido por Emotion (MUI CSS-in-JS inyecta <style> en runtime)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self';" always;

  # --- env-config.js: nunca en caché (contiene config de runtime) ---
  location = /env-config.js {
    limit_req zone=envconfig burst=10 nodelay;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma        "no-cache"                            always;
    add_header X-Robots-Tag  "noindex, nofollow, noarchive"         always;
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self';" always;
    try_files $uri =404;
  }

  # --- Estáticos con fingerprint (hash en nombre): caché larga ---
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self';" always;
    try_files $uri =404;
  }

  # --- index.html: nunca en caché (evita servir HTML viejo con refs a assets ya eliminados) ---
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; form-action 'self';" always;
    try_files $uri =404;
  }

  # --- SPA fallback con rate limiting ---
  location / {
    limit_req zone=general burst=50 nodelay;
    try_files $uri /index.html;
  }

  location ~ /\. {
    deny all;
    return 404;
  }

  error_page 404 /index.html;
  error_page 500 502 503 504 /index.html;
}
