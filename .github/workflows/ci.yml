name: CI

on:
  pull_request:
    # 'edited' es necesario para que renombrar el título del PR dispare un
    # run nuevo — sin esto, github.event.pull_request.title queda congelado
    # con el valor del momento en que se abrió/actualizó el PR por última vez,
    # y ni siquiera "Re-run jobs" lo refresca (reusa el mismo payload).
    types: [opened, synchronize, reopened, edited]
    branches: [main, qa, dev]
  push:
    branches: [main, qa, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Se usa squash merge: el único mensaje que sobrevive en el historial de
      # main/qa/dev es el título del PR (GitHub lo usa como mensaje del commit
      # squasheado), así que es lo único que tiene sentido validar — no los
      # commits individuales del PR, que se descartan al mergear.
      - name: Lint del título del PR (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

      # Los pasos de código (format/lint/test/build) no aportan nada cuando el
      # evento fue solo "edited" (título/descripción del PR) sin push nuevo —
      # se saltan para no gastar minutos de CI en algo que no cambió código.
      - name: Format check
        if: github.event.action != 'edited'
        run: yarn format:check

      - name: Lint
        if: github.event.action != 'edited'
        run: yarn lint

      - name: Test
        if: github.event.action != 'edited'
        run: yarn test:run

      - name: Build
        if: github.event.action != 'edited'
        run: yarn build
