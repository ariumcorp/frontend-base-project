name: CI

on:
  pull_request:
    branches: [main, qa, dev]
  push:
    branches: [main, qa, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Se usa squash merge: el único mensaje que sobrevive en el historial de
      # main/qa/dev es el título del PR (GitHub lo usa como mensaje del commit
      # squasheado), así que es lo único que tiene sentido validar — no los
      # commits individuales del PR, que se descartan al mergear.
      - name: Lint del título del PR (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:run

      - name: Build
        run: yarn build
